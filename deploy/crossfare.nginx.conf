# For an instance that already runs nginx. Adds one site and leaves the others alone.
# Replace the name below with your domain. Certbot adds HTTPS to this block.
server {
    listen 80;
    server_name crossfare.example.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A paid quote waits on the venues, Hedera and Arkiv.
        proxy_read_timeout 90s;
    }
}
